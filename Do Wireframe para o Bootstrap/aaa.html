<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Exemplo 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css.css">
</head>

<body>

    <header class="bg-dark text-light p-3">
        Header
    </header>

    <main>

        <section id="carrosel" class="bg-info p-5 text-center">
            Banner
        </section>

        <section id="s1">
            <div class="container-row text-center">
                <div class="row">
                    <div class="col-4 bg-primary p-4 text-light">
                        Coluna 4
                    </div>

                    <div class="col-8 bg-danger p-4 text-light">
                        Coluna 8
                    </div>
                </div>
            </div>
        </section>

        <section id="s2">
            <div class="container-row text-center">
                <div class="row">
                    <div class="col-8 bg-success p-4 text-light">
                        1
                    </div>

                    <div class="col-4 bg-warning p-4">
                        2
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-dark text-light p-3 text-center">
        Rodapé
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
